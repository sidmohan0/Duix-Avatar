<svg width="680" height="520" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Duix-Avatar macOS architecture</title>
  <desc>The Electron desktop app on the macOS host talks over HTTP to three CPU-mode AI service containers in a Colima VM: video generation, text to speech, and speech recognition. Files are exchanged through a shared data directory.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .region { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 4; }
    .rlabel { font-size: 12px; fill: #5F5E5A; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="600" height="166" rx="8" class="region"/>
  <text x="52" y="68" class="rlabel">macOS host — Electron desktop app</text>
  <g class="purple"><rect x="60" y="80" width="190" height="52" rx="4"/><text x="155" y="101" text-anchor="middle" class="th">Renderer — Vue 3</text><text x="155" y="119" text-anchor="middle" class="ts">Pinia, vue-i18n, TDesign</text></g>
  <g class="purple"><rect x="285" y="80" width="180" height="52" rx="4"/><text x="375" y="101" text-anchor="middle" class="th">Main — Electron 33</text><text x="375" y="119" text-anchor="middle" class="ts">axios, electron-log</text></g>
  <g class="purple"><rect x="60" y="152" width="190" height="52" rx="4"/><text x="155" y="173" text-anchor="middle" class="th">SQLite store</text><text x="155" y="191" text-anchor="middle" class="ts">better-sqlite3, biz.db</text></g>
  <g class="purple"><rect x="465" y="152" width="170" height="52" rx="4"/><text x="550" y="173" text-anchor="middle" class="th">ffmpeg (Homebrew)</text><text x="550" y="191" text-anchor="middle" class="ts">fluent-ffmpeg</text></g>
  <line x1="250" y1="106" x2="283" y2="106" class="arr" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="470" y="246" width="170" height="64" rx="4"/><text x="555" y="272" text-anchor="middle" class="th">~/duix_avatar_data</text><text x="555" y="290" text-anchor="middle" class="ts">shared bind mounts</text></g>
  <line x1="555" y1="216" x2="555" y2="244" class="leader"/>
  <line x1="555" y1="312" x2="555" y2="338" class="leader"/>
  <path d="M320 132 L320 300 L155 300 L155 370" class="arr" marker-end="url(#arrow)"/>
  <line x1="400" y1="132" x2="400" y2="370" class="arr" marker-end="url(#arrow)"/>
  <rect x="40" y="340" width="600" height="124" rx="8" class="region"/>
  <text x="52" y="358" class="rlabel">Colima VM (vz + Rosetta) — Docker Compose</text>
  <g class="teal"><rect x="60" y="372" width="190" height="80" rx="4"/><text x="155" y="392" text-anchor="middle" class="th">Video gen — :8383</text><text x="155" y="410" text-anchor="middle" class="ts">guiji2025/duix.avatar</text><text x="155" y="426" text-anchor="middle" class="ts">PyTorch, onnxruntime</text><text x="155" y="442" text-anchor="middle" class="ts">sitecustomize CPU shim</text></g>
  <g class="teal"><rect x="270" y="372" width="180" height="80" rx="4"/><text x="360" y="392" text-anchor="middle" class="th">TTS — :18180</text><text x="360" y="410" text-anchor="middle" class="ts">fish-speech-ziming</text><text x="360" y="426" text-anchor="middle" class="ts">LLaMA codec, CPU</text><text x="360" y="442" text-anchor="middle" class="ts">voice cloning</text></g>
  <g class="teal"><rect x="470" y="372" width="170" height="80" rx="4"/><text x="555" y="392" text-anchor="middle" class="th">ASR — :10095</text><text x="555" y="410" text-anchor="middle" class="ts">FunASR CPU runtime</text><text x="555" y="426" text-anchor="middle" class="ts">paraformer ONNX</text><text x="555" y="442" text-anchor="middle" class="ts">FSMN-VAD, CT punc</text></g>
  <line x1="450" y1="412" x2="468" y2="412" class="arr" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="60" y="480" width="12" height="12" rx="2"/></g>
  <text x="80" y="490" class="rlabel">desktop app</text>
  <g class="teal"><rect x="180" y="480" width="12" height="12" rx="2"/></g>
  <text x="200" y="490" class="rlabel">AI service containers</text>
  <g class="gray"><rect x="350" y="480" width="12" height="12" rx="2"/></g>
  <text x="370" y="490" class="rlabel">shared storage</text>
</svg>
